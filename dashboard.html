<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Dashboard Geral - KA Voice</title>
<style>
  body { background: #0a0a0a; color: #fff; font-family: system-ui, sans-serif; padding: 40px; }
  .card { background: #151515; border: 1px solid #333; border-radius: 12px; padding: 24px; margin-bottom: 20px; }
  table { width: 100%; border-collapse: collapse; margin-top: 16px; }
  th, td { text-align: left; padding: 12px; border-bottom: 1px solid #333; }
  th { color: #888; font-size: 13px; }
  button { background: #FFD400; color: #000; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  a { color: #FFD400; text-decoration: none; }
</style>
</head>
<body>
<h1>📊 Dashboard Geral</h1>

<div class="card">
  <h2>Clientes Ativos</h2>
  <table id="clients-table">
    <thead><tr><th>Marca</th><th>Domínio</th><th>Ações</th></tr></thead>
    <tbody id="clients-body"><tr><td colspan="3">Carregando...</td></tr></tbody>
  </table>
</div>

<div class="card">
  <h2>Leads Recentes <button id="btn-export" disabled onclick="doExport()"> Exportar CSV</button></h2>
  <table id="leads-table">
    <thead><tr><th>Telefone</th><th>Contexto</th><th>Data</th></tr></thead>
    <tbody id="leads-body"><tr><td colspan="3">Selecione um cliente</td></tr></tbody>
  </table>
</div>

<script>
const API = '/api/admin'; // ← MUDAR PARA URL DO RENDER APÓS DEPLOY
let currentClient = null;

async function loadClients() {
  try {
    const res = await fetch(API + '/admin/clients');
    const data = await res.json();
    const clients = Array.isArray(data) ? data : [];
    
    document.getElementById('clients-body').innerHTML = clients.length === 0 
      ? '<tr><td colspan="3">Nenhum cliente</td></tr>'
      : clients.map(c => `<tr>
          <td>${c.name || c.id}</td>
          <td>${c.domain}</td>
          <td><a href="#" onclick="loadLeads('${c.client_id || c.id}'); return false;">Ver Leads →</a></td>
        </tr>`).join('');
        
    if (clients.length > 0) loadLeads(clients[0].client_id || clients[0].id);
  } catch (e) {
    document.getElementById('clients-body').innerHTML = `<tr><td colspan="3">Erro: ${e.message}</td></tr>`;
  }
}

async function loadLeads(cid) {
  currentClient = cid;
  document.getElementById('btn-export').disabled = false;
  
  try {
    const res = await fetch(API + `/admin/leads/${cid}`);
    const data = await res.json();
    const leads = Array.isArray(data) ? data : [];
    
    document.getElementById('leads-body').innerHTML = leads.length === 0
      ? '<tr><td colspan="3">Sem leads</td></tr>'
      : leads.map(l => `<tr>
          <td><a href="https://wa.me/55${String(l.phone||'').replace(/\D/g,'')}" target="_blank">${l.phone||'-'}</a></td>
          <td>${String(l.summary||'-').substring(0,60)}</td>
          <td>${new Date(l.date||Date.now()).toLocaleDateString()}</td>
        </tr>`).join('');
  } catch (e) {
    document.getElementById('leads-body').innerHTML = `<tr><td colspan="3">Erro: ${e.message}</td></tr>`;
  }
}

function doExport() {
  if (!currentClient) return alert('Selecione um cliente');
  window.open(API + `/admin/leads/${currentClient}/export`, '_blank');
}

window.onload = loadClients;
</script>
</body>
</html>
