<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Assistente Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#000000; --fg:#ffffff; --muted:#8c8c8c; --line:rgba(255,255,255,0.10); --line-soft:rgba(255,255,255,0.06); --card:rgba(255,255,255,0.02); --accent:#FFD400;
</style>
</head>
<body>

<canvas id="bg"></canvas>
<div class="grain"></div>

<div id="microsite" style="display:none; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; position: relative; z-index: 2;">
    <div style="max-width: 600px; width: 100%; text-align: center; margin-bottom: 40px;">
        <img id="ms-logo" src="" alt="Logo" style="max-height: 80px; margin-bottom: 24px; border-radius: 12px; display: none;">
        <h1 id="ms-title" style="font-size: 1.5rem; margin-bottom: 12px; color: var(--fg);"></h1>
        <p id="ms-copy" style="font-size: 1.1rem; color: var(--muted); margin-bottom: 32px;"></p>
    </div>
</div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const clientId = urlParams.get('client');

if (clientId) {
    fetch(`https://ka-voice-backend.onrender.com/widget/config/${clientId}`)
    .then(res => res.json())
    .then(config => {
        document.documentElement.style.setProperty('--accent', config.accent_color || '#FFD400');
        const microsite = document.getElementById('microsite');
        microsite.style.display = 'flex';
        
        const logo = document.getElementById('ms-logo');
        if (config.logo_url) {
            logo.src = config.logo_url;
            logo.style.display = 'block';
        }
        document.getElementById('ms-title').innerText = config.bio_headline || 'Recepcionista Digital';
        document.getElementById('ms-copy').innerText = config.bio_cta || 'Toque no microfone e fale comigo.';
        
        // Injeta o Widget KA Vox
        const script = document.createElement('script');
        script.src = 'https://kaagenciacriativa.vercel.app/widget.js';
        script.setAttribute('data-client-id', clientId);
        script.defer = true;
        document.body.appendChild(script);
    });
}

// Script do Canvas (igual ao site mãe)
var canvas=document.getElementById('bg');var ctx=canvas.getContext('2d');var w,h,dpr=Math.min(window.devicePixelRatio||1,2);var orbs=[],ripples=[];var pointer={x:-9999,y:-9999,active:false};var glow={x:0,y:0};function rand(a,b){return a+Math.random()*(b-a)}function buildOrbs(){orbs=[];for(var i=0;i<6;i++){orbs.push({bx:rand(0,w),by:rand(0,h),x:0,y:0,r:rand(Math.min(w,h)*0.22,Math.min(w,h)*0.5),ph:rand(0,Math.PI*2),sp:rand(0.00012,0.0004),amp:rand(30,90),a:rand(0.05,0.11),g:Math.round(rand(150,255))})}glow.x=w/2;glow.y=h/2}function resize(){w=window.innerWidth;h=window.innerHeight;canvas.width=w*dpr;canvas.height=h*dpr;canvas.style.width=w+'px';canvas.style.height=h+'px';ctx.setTransform(dpr,0,0,dpr,0,0);buildOrbs()}window.addEventListener('resize',resize);resize();window.addEventListener('pointermove',function(e){pointer.x=e.clientX;pointer.y=e.clientY;pointer.active=true},{passive:true});window.addEventListener('pointerdown',function(e){pointer.x=e.clientX;pointer.y=e.clientY;pointer.active=true;ripples.push({x:e.clientX,y:e.clientY,r:0,a:0.5,max:rand(180,260)})},{passive:true});window.addEventListener('pointerleave',function(){pointer.active=false});function frame(t){ctx.globalCompositeOperation='source-over';ctx.fillStyle='#000';ctx.fillRect(0,0,w,h);ctx.globalCompositeOperation='lighter';if(pointer.active){glow.x+=(pointer.x-glow.x)*0.12;glow.y+=(pointer.y-glow.y)*0.12;var gg=ctx.createRadialGradient(glow.x,glow.y,0,glow.x,glow.y,260);gg.addColorStop(0,'rgba(255,255,255,0.10)');gg.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=gg;ctx.beginPath();ctx.arc(glow.x,glow.y,260,0,Math.PI*2);ctx.fill()}for(var i=0;i<orbs.length;i++){var o=orbs[i];var tx=o.bx+Math.cos(t*o.sp+o.ph)*o.amp;var ty=o.by+Math.sin(t*o.sp*1.3+o.ph)*o.amp;if(pointer.active){var dx=tx-pointer.x,dy=ty-pointer.y;var d=Math.sqrt(dx*dx+dy*dy);if(d<240&&d>0.01){var f=(1-d/240)*70;tx+=(dx/d)*f;ty+=(dy/d)*f}}o.x+=(tx-o.x)*0.05;o.y+=(ty-o.y)*0.05;var grad=ctx.createRadialGradient(o.x,o.y,0,o.x,o.y,o.r);grad.addColorStop(0,'rgba('+o.g+','+o.g+','+o.g+','+o.a+')');grad.addColorStop(1,'rgba('+o.g+','+o.g+','+o.g+',0)');ctx.fillStyle=grad;ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,Math.PI*2);ctx.fill()}for(var r=ripples.length-1;r>=0;r--){var rp=ripples[r];rp.r+=(rp.max-rp.r)*0.06+1.2;rp.a*=0.94;ctx.strokeStyle='rgba(255,255,255,'+rp.a.toFixed(3)+')';ctx.lineWidth=1;ctx.beginPath();ctx.arc(rp.x,rp.y,rp.r,0,Math.PI*2);ctx.stroke();if(rp.a<0.01||rp.r>rp.max)ripples.splice(r,1)}requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script>
</body>
</html>
